# Tabby - Nginx routing snippet (equivalent of apache/public/.htaccess).
# Include inside the site's `server { ... }` block, with `root` pointing at the
# deployed `public/` directory. NOT testable locally; verify on the real host.
#
# Routing contract (Spec section 9):
#   /              -> index.html (index directive)
#   /test          -> test.html
#   existing files -> served directly
#   everything else -> index.php, query string preserved

index index.html;

# Keep crawlers out (mirrors the X-Robots-Tag header set by .htaccess).
add_header X-Robots-Tag noindex always;

# Record the values the host actually uses (Spec section 9), then uncomment
# or adjust them to match:
# client_max_body_size 110m;   # NOTE: record the host's actual value
# fastcgi_read_timeout 15s;    # NOTE: record the host's actual value (put it inside the PHP location below)

location = /test {
    try_files /test.html =404;
}

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # PLACEHOLDER: replace with the host's PHP-FPM socket or address.
    fastcgi_pass unix:/run/php/php-fpm.sock;
}
